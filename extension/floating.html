<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NexoMail Assistant</title>
  <link rel="stylesheet" href="floating.css?v=2.1.0">
</head>
<body>
  <nav aria-label="Secciones del asistente">
    <button data-section="chat" aria-pressed="true">Chat</button>
    <button data-section="mail" aria-pressed="false" hidden>Correo</button>
    <button data-section="actions" aria-pressed="false">Acciones</button>
    <button data-section="history" aria-pressed="false">Historial</button>
    <button data-section="settings" aria-pressed="false">Ajustes</button>
  </nav>
  <main id="workspace">
    <section id="loading" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p id="status">Abriendo NexoMail…</p>
      <div id="recovery" hidden>
        <button id="retry">Volver a abrir el chat</button>
        <button id="open-full">Ver el módulo en una pestaña</button>
      </div>
    </section>
  </main>
  <script type="module" src="floating.js?v=2.1.0"></script>
</body>
</html>
